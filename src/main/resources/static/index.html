<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Gestión de Empleados</title>
    <link rel="stylesheet" href="/css/estilo.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="contenedor">

    <header class="encabezado">
        <h1><i class="fas fa-users"></i> Gestión de Empleados</h1>
        <button id="btnRegistrar" class="btn btn-primario">
            <i class="fas fa-plus"></i> Nuevo Empleado
        </button>
    </header>

    <div class="contenedor-busqueda">
        <div class="caja-busqueda">
            <i class="fas fa-search"></i>
            <input type="text" id="buscarInput" placeholder="Buscar empleado..." />
        </div>
        <div class="caja-filtro">
            <select id="filtroDepartamento">
                <option value="">Todos los departamentos</option>
                <option value="Tecnología">Tecnología</option>
                <option value="RRHH">Recursos Humanos</option>
                <option value="Finanzas">Finanzas</option>
                <option value="Marketing">Marketing</option>
                <option value="Ventas">Ventas</option>
                <option value="TI">TI</option>
                <option value="Operaciones">Operaciones</option>
            </select>
        </div>
    </div>

    <div class="contenedor-tabla">
        <table>
            <thead>
            <tr>
                <th>Empleado</th>
                <th>Email</th>
                <th>Departamento</th>
                <th>Cargo</th>
                <th>Estado</th>
                <th style="text-align:center;">Acciones</th>
            </tr>
            </thead>
            <tbody id="cuerpoTabla">
            </tbody>
        </table>
    </div>

    <div class="paginacion">
        <button id="paginaAnterior"><i class="fas fa-chevron-left"></i> Anterior</button>
        <span id="infoPagina">Página 1 de 1</span>
        <button id="paginaSiguiente">Siguiente <i class="fas fa-chevron-right"></i></button>
    </div>

</div>

<div id="modalEmpleado" class="modal">
    <div class="contenido-modal">

        <div class="cabecera-modal">
            <h2 id="tituloModal">
                <i class="fas fa-user-plus" style="color: #4361ee; margin-right: 10px;"></i>
                Registrar Empleado
            </h2>
            <span class="cerrar" id="cerrarModal">&times;</span>
        </div>

        <form id="formularioEmpleado">
            <input type="hidden" id="empleadoId" />

            <div class="fila-formulario">
                <div class="grupo-formulario">
                    <label for="nombre">Nombre completo *</label>
                    <input type="text" id="nombre" required placeholder="Juan Pérez" />
                </div>
                <div class="grupo-formulario">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required placeholder="juan@empresa.com" />
                </div>
            </div>

            <div class="grupo-formulario">
                <label for="contrasena">Contraseña *</label>
                <input type="password" id="contrasena" required placeholder="Mínimo 6 caracteres" minlength="6" />
            </div>

            <div class="fila-formulario">
                <div class="grupo-formulario">
                    <label for="departamento">Departamento</label>
                    <select id="departamento">
                        <option value="">Seleccionar...</option>
                        <option value="Tecnología">Tecnología</option>
                        <option value="RRHH">Recursos Humanos</option>
                        <option value="Finanzas">Finanzas</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Ventas">Ventas</option>
                        <option value="TI">TI</option>
                        <option value="Operaciones">Operaciones</option>
                    </select>
                </div>
                <div class="grupo-formulario">
                    <label for="cargo">Cargo</label>
                    <input type="text" id="cargo" placeholder="Desarrollador" />
                </div>
            </div>

            <div class="fila-formulario">
                <div class="grupo-formulario">
                    <label for="estado">Estado</label>
                    <select id="estado">
                        <option value="ACTIVO">Activo</option>
                        <option value="INACTIVO">Inactivo</option>
                    </select>
                </div>
                <div class="grupo-formulario">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" placeholder="+1234567890" />
                </div>
            </div>

            <div class="grupo-formulario">
                <label for="fechaContratacion">Fecha de contratación</label>
                <input type="date" id="fechaContratacion" />
            </div>

            <div class="grupo-formulario">
                <label for="habilidades">Habilidades (separadas por comas)</label>
                <input type="text" id="habilidades" placeholder="JavaScript, React, Java, Spring Boot" maxlength="200" />
            </div>

            <div class="grupo-formulario">
                <label for="direccion">Dirección</label>
                <textarea id="direccion" rows="2" placeholder="Calle, ciudad, país"></textarea>
            </div>

            <div class="acciones-formulario">
                <button type="button" class="btn btn-secundario" id="btnCancelar">Cancelar</button>
                <button type="submit" class="btn btn-primario" id="btnGuardar">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </div>

        </form>
    </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
