# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/empleados_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Archivos estáticos
spring.web.resources.add-mappings=true
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Desactivar Thymeleaf (usamos solo archivos estáticos)
spring.thymeleaf.enabled=false

# Puerto
server.port=8080

# Logging
logging.level.com.empresa=DEBUG
logging.level.org.springframework.web=INFO